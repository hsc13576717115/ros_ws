pointcloud_to_scan:
  ros__parameters:
    input_topic: /fastlio/cloud_registered_body
    output_topic: /scan
    target_frame: base_link
    queue_size: 10
    point_skip: 3
    transform_timeout_sec: 0.1
    min_height: 0.05
    max_height: 0.60
    range_min: 0.45
    range_max: 12.0
    angle_min: -3.141592653589793
    angle_max: 3.141592653589793
    angle_increment: 0.008726646259971648
    scan_time: 0.1
    use_inf: true
    inf_epsilon: 0.01
