# 任务赛预设航点配置（map 坐标系，单位：米）
#
# 坐标约定：
# - 机器人在启动区中心开机/启动 SLAM，该点就是 map 原点 (0, 0)。
# - 启动时机器人朝向为 0 度，+x 指向任务场内部，+y 指向机器人左侧。
# - 任务场本体参考边界：x=0.50~6.50, y=-2.00~2.00。
# - 下方 pick/place 坐标都是机器人 base_link 的停靠点，不是箱子或归位区中心。
# - 机械臂前向工作距离按 0.40m 估算；实测后只微调各停靠点 x/y/yaw。
#
# 流程：
# role 简写：
# - observe：导航到观察位，到点后启动 YOLO。
# - pick_auto_place：导航到抓取位，机械臂 pick 后自动插入去对应 class 放置区的路线。
#   默认动态路线：先回到 y=0 主通道，再沿 y=0 直接到 transfer_x，最后去对应 class 放置区。
# - pick：只抓取，不自动插入放置路线；后面可以手写 carry/place/return 点。
# - carry：带箱普通途径点。
# - place：机械臂 place；place.target=auto 时使用最近一次 YOLO class 对应放置区坐标。
# - return：空载普通途径点。
#
# 例：如果想手写 PICK_01 后的途径点，把 PICK_01 的 role 改为 pick，然后追加：
# - {name: CARRY_01_AISLE, role: carry, x: 3.20, y: 1.55, yaw_deg: 0.0}
# - {name: PLACE_01_AUTO, role: place, x: 5.10, y: 0.00, yaw_deg: 0.0, target: auto}

yolo:
  settle_sec: 1.0
  timeout_sec: 3.0
  min_score: 0.5

place_targets:
  class_0:
    x: 5.0
    y: 1.10
    yaw_deg: 0.0
    aliases: ['class0', '0', 'food', '食品']
  class_1:
    x: 5.0
    y: 0.40
    yaw_deg: 0.0
    aliases: ['class1', '1', 'tool', '工具']
  class_2:
    x: 5.0
    y: -0.40
    yaw_deg: 0.0
    aliases: ['class2', '2', 'instrument', '仪器']
  class_3:
    x: 5.0
    y: -1.20
    yaw_deg: 0.0
    aliases: ['class3', '3', 'medicine', '药品']

waypoints:
  - {name: OBSERVE_01, role: observe, x: 1.00, y: 0.375, yaw_deg: 0.0}
  - {name: PICK_01, role: pick_auto_place, x: 1.6, y: 0.375, yaw_deg: 0.0, transfer_x: 4.60, centerline_y: 0.0, side_aisle_y: 1.55, return_to_next_pick: true}

