# Nav2 参数配置（SLAM 实时建图 + 导航模式）
# 适用启动：ros2 launch nav2_config dog_slam_navigation.py
# 本文件由以下模块共同读取：
# - controller_server（局部控制）
# - planner_server（全局规划）
# - behavior_server（恢复行为）
# - smoother_server（路径平滑）
# - bt_navigator（行为树导航）
# - local_costmap / global_costmap（代价地图）

controller_server:
  ros__parameters:
    use_sim_time: false                    # 是否使用仿真时间；真机保持 false
    controller_frequency: 12.0             # 控制器循环频率(Hz)，降低 missed loop，减少控制滞后
    min_x_velocity_threshold: 0.001        # 线速度死区阈值（x）
    min_y_velocity_threshold: 0.001        # 线速度死区阈值（y）
    min_theta_velocity_threshold: 0.001    # 角速度死区阈值
    failure_tolerance: 0.3                 # 允许短时控制失败的容忍时间(s)
    progress_checker_plugin: "progress_checker"  # 进度检查器插件名
    goal_checker_plugins: ["goal_checker"]       # 到点检查器插件名列表（Humble 参数写法）
    controller_plugins: ["FollowPath"]           # 启用的局部控制插件列表

    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"  # 外层旋转shim：到目标区后锁定原地旋转，不退回路径跟踪
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"  # 主路径跟踪器
      angular_dist_threshold: 3.14         # 彻底禁用 RotationShim 原地旋转，四足原地转易漂移导致停不下来
      angular_disengage_threshold: 0.35    # 退出阈值保留，实际已不会触发
      rotate_to_heading_angular_vel: 0.14  # 慢速微调朝向，避免原地对准过快
      max_angular_accel: 0.20              # 降低角加速度，减少微调过冲
      forward_sampling_distance: 0.30      # 沿路径向前采样距离，用于估算路径方向；不影响 rotate_to_goal_heading
      simulate_ahead_time: 0.6             # 缩短旋转碰撞前瞻时间，避免过度保守
      rotate_to_goal_heading: false        # 关闭 RotationShim 终点原地朝向对齐，改由 bridge final_align 比例控制
      closed_loop: true                    # 用里程计角速度闭环约束旋转过程

      desired_linear_vel: 0.14             # 与 velocity_smoother / 四足步态可执行速度对齐，稳妥完赛优先
      lookahead_dist: 0.45                 # 减小前瞻，提升小空间路径贴合度
      min_lookahead_dist: 0.22             # 最小前瞻距离(m)
      max_lookahead_dist: 0.60             # 最大前瞻距离(m)
      lookahead_angle: 0.3                 # 前瞻角限制(rad)
      use_velocity_scaled_lookahead_dist: false   # 低速精确导航下使用固定前瞻更稳定
      use_approach_vel_scaling: true       # 接近目标时自动降速
      approach_velocity_scaling_dist: 0.8  # 提前降速，给终点对齐留出缓冲
      min_approach_linear_velocity: 0.06   # 低于 0.06m/s 四足实际不迈步，避免接近目标时暂停
      max_allowed_linear_accel: 0.35       # 最大线加速度，减少起停前冲
      regulated_linear_scaling_min_radius: 0.90
      regulated_linear_scaling_min_speed: 0.06
      use_cost_regulated_linear_velocity_scaling: true  # 障碍附近自动降速
      cost_scaling_dist: 0.65              # 更早在贴边场景下减速，给 0.5kg 搬运留余量
      cost_scaling_gain: 0.60              # 提高贴障减速强度，改善停车精度
      inflation_cost_scaling_factor: 2.2   # 与膨胀层匹配的代价缩放系数，保留更宽安全梯度
      use_rotate_to_heading: false         # 关闭RPP内置转向，避免与RotationShim重复导致频繁停转
      rotate_to_heading_min_angle: 0.35    # 兼容保留（RPP关闭转向时该项基本不生效）
      allow_reversing: false               # 四足保持不倒车

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"  # 进度检查器实现
      required_movement_radius: 0.15        # 低速模式下降低进度阈值，避免误判卡住
      movement_time_allowance: 20.0         # 给四足低速精确调整更多时间

    goal_checker:
      plugin: "nav2_controller::StoppedGoalChecker"  # 要求速度接近零才算到达，防止旋转中被误判
      xy_goal_tolerance: 0.10               # 收紧位置容差
      yaw_goal_tolerance: 3.14              # 不强制终点朝向，避免四足到点后原地旋转
      stateful: false
      trans_stopped_velocity: 0.10          # 线速度 < 10cm/s 才算停止
      rot_stopped_velocity: 0.10            # 角速度 < 0.1 rad/s 才算停止

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0         # 期望全局规划频率(Hz)，行为树已限频，避免抢占 controller CPU
    use_sim_time: false                     # 是否使用仿真时间
    planner_plugins: ["GridBased"]          # 全局规划插件列表
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"  # 2D A* 网格规划器，避免 Hybrid/Dubin 生成大弧线
      tolerance: 0.05                       # 目标点附近容差，减少替代终点
      use_astar: true                       # 使用 A*，开放区域更接近直线路径
      allow_unknown: true                   # SLAM 初期允许穿过未知区域

smoother_server:
  ros__parameters:
    use_sim_time: false                     # 是否使用仿真时间
    smoother_plugins: ["simple_smoother"]   # 路径平滑插件列表
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"  # 简单平滑器
      tolerance: 1.0e-10                    # 迭代收敛阈值
      max_its: 1000                         # 最大迭代次数
      do_refinement: true                   # 是否启用二次细化

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 12.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.14, 0.0, 0.14]
    min_velocity: [-0.14, 0.0, -0.14]
    max_accel: [0.35, 0.0, 0.20]
    max_decel: [-0.45, 0.0, -0.20]
    odom_topic: "/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.35

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw         # 行为模块订阅的局部代价地图
    footprint_topic: local_costmap/published_footprint  # 机器人足迹话题
    cycle_frequency: 10.0                             # 恢复行为循环频率(Hz)，减少与 controller 抢调度
    behavior_plugins: ["spin", "wait"]                # 禁用自动后退；Spin 仅供受控同点转向航点调用
    global_frame: odom                                # 恢复行为参考坐标系
    robot_base_frame: base_link                       # 机器人基座坐标系
    use_sim_time: false                               # 是否使用仿真时间

    spin:
      plugin: "nav2_behaviors/Spin"                   # 原地旋转行为
    simulate_ahead_time: 0.5                           # 缩短碰撞前瞻，降低 spin 计算量
    max_rotational_vel: 0.12                           # 降低 /spin 角速度，减少四足原地转向漂移
    min_rotational_vel: 0.04                           # 保持可执行的最小角速度
    rotational_acc_lim: 0.18                           # 降低 /spin 角加速度，避免起停冲击
    wait:
      plugin: "nav2_behaviors/Wait"                   # 等待行为

bt_navigator:
  ros__parameters:
    use_sim_time: false                               # 是否使用仿真时间
    global_frame: "map"                               # 全局导航参考坐标系
    robot_base_frame: "base_link"                     # 机器人基座坐标系
    odom_topic: "/odom"                               # 里程计话题
    bt_loop_duration: 30                              # 行为树循环周期(ms)，降低空转调度压力
    default_server_timeout: 20                        # 行为树节点默认超时(s)
    enable_groot_monitoring: false                    # 关闭 Groot 监控，减少额外发布与序列化开销
    # 行为树可用插件库（动作/条件节点）
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_controller_selector_bt_node
    - nav2_path_longer_on_approach_bt_node
    - nav2_wait_cancel_bt_node
    - nav2_spin_cancel_bt_node
    - nav2_back_up_cancel_bt_node
    - nav2_assisted_teleop_cancel_bt_node
    - nav2_drive_on_heading_bt_node
    - nav2_is_path_valid_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    default_nav_to_pose_bt_xml: "navigate_to_pose_w_path_invalid_replanning_and_recovery.xml" # Humble 单目标导航默认行为树
    default_nav_through_poses_bt_xml: "navigate_through_poses_w_replanning_and_recovery.xml" # Humble 多目标导航默认行为树
    default_nav_to_pose_bt_node_xml: "navigate_to_pose_w_path_invalid_replanning_and_recovery.xml" # 兼容旧键名
    default_nav_through_poses_bt_node_xml: "navigate_through_poses_w_replanning_and_recovery.xml" # 兼容旧键名

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: false                     # bt_navigator 的 rclcpp wrapper 参数

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 6.0                  # 局部代价地图更新频率(Hz)，给 controller 留出稳定周期
      publish_frequency: 2.0                 # 局部代价地图发布频率(Hz)，显示链路降负载
      global_frame: odom                    # 局部代价地图坐标系（通常 odom）
      robot_base_frame: base_link           # 机器人基座坐标系
      use_sim_time: false                   # 是否使用仿真时间
      rolling_window: true                  # 局部地图是否跟随机器人滚动
      width: 3                              # 局部地图宽度(m)
      height: 3                             # 局部地图高度(m)
      resolution: 0.05                      # 地图分辨率(m/格)
      footprint: "[[0.400, 0.227], [0.400, -0.227], [-0.400, -0.227], [-0.400, 0.227]]"  # 机体 800mm x 454mm，base_link 位于机体中心
      footprint_padding: 0.03               # 任务赛带箱/摆腿留 3cm 安全边界
      plugins: ["voxel_layer", "inflation_layer"]   # 局部地图启用插件

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"   # 障碍膨胀层
        cost_scaling_factor: 2.2                    # 膨胀代价衰减系数，保留更宽安全梯度
        inflation_radius: 0.30                     # 不小于足迹内切半径，避免贴障误判到达/碰撞风险

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"       # 三维体素障碍层（用激光更新）
        enabled: true                               # 是否启用
        footprint_clearing_enabled: true            # 清除机器人足迹内障碍，避免把机体自身打成障碍
        publish_voxel_map: false                    # 关闭体素可视化发布，节省 CPU / 带宽
        origin_z: 0.0                               # 体素地图Z原点
        z_resolution: 0.05                          # Z方向分辨率
        z_voxels: 16                                # Z方向体素层数
        max_obstacle_height: 2.0                    # 最大障碍高度(m)
        mark_threshold: 0                           # 体素标记阈值
        observation_sources: scan                   # 观测源列表
        scan:
          topic: /scan                              # 激光话题
          max_obstacle_height: 2.0                  # 激光可标记的最大高度
          clearing: true                            # 是否清障
          marking: true                             # 是否标障
          data_type: "LaserScan"                    # 观测数据类型
          raytrace_max_range: 3.0                   # 清障射线最大距离(m)
          raytrace_min_range: 0.20                  # 自身点已在雷达驱动中过滤，这里保留近距离清障能力
          obstacle_max_range: 2.5                   # 标障最大距离(m)
          obstacle_min_range: 0.20                  # 自身点已在雷达驱动中过滤，这里保留近距离障碍感知

      always_send_full_costmap: False               # 改为增量更新，降低 RViz 和 DDS 负载

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0                         # 全局代价地图更新频率(Hz)，SLAM 模式下降低全局层抢占
      publish_frequency: 0.5                        # 全局代价地图发布频率(Hz)，显示链路降负载
      global_frame: map                             # 全局地图坐标系（map）
      robot_base_frame: base_link                   # 机器人基座坐标系
      use_sim_time: false                           # 是否使用仿真时间
      footprint: "[[0.400, 0.227], [0.400, -0.227], [-0.400, -0.227], [-0.400, 0.227]]"  # 机体 800mm x 454mm，base_link 位于机体中心
      footprint_padding: 0.03                       # 与局部地图一致，规划目标不贴箱/墙
      resolution: 0.05                              # 地图分辨率(m/格)
      track_unknown_space: false                    # 未知区域按可通行处理，避免 SLAM 初期绕未知区
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]  # 全局地图插件

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"      # 静态地图层（从/map构建）
        map_subscribe_transient_local: True         # 订阅静态地图时使用 transient_local

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"    # 障碍物层
        enabled: true                               # 是否启用障碍层
        footprint_clearing_enabled: true            # 清除机器人足迹内障碍，避免把机体自身打成障碍
        observation_sources: scan                   # 观测源列表
        scan:
          topic: /scan                              # 激光话题
          max_obstacle_height: 2.0                  # 激光可标记的最大高度
          clearing: true                            # 是否清障
          marking: true                             # 是否标障
          data_type: "LaserScan"                    # 观测数据类型
          raytrace_max_range: 12.0                  # 清障射线最大距离(m)
          raytrace_min_range: 0.20                  # 自身点已在雷达驱动中过滤，这里保留近距离清障能力
          obstacle_max_range: 12.0                  # 标障最大距离(m)
          obstacle_min_range: 0.20                  # 自身点已在雷达驱动中过滤，这里保留近距离障碍感知

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"   # 膨胀层
        cost_scaling_factor: 2.2                    # 膨胀代价衰减系数，保留更宽安全梯度
        inflation_radius: 0.30                     # 不小于足迹内切半径，避免贴障误判到达/碰撞风险

      always_send_full_costmap: False               # 改为增量更新，降低 RViz 和 DDS 负载

map_server:
  ros__parameters:
    use_sim_time: false                             # 是否使用仿真时间（SLAM模式下map来自cartographer）

robot_state_publisher:
  ros__parameters:
    use_sim_time: false                             # robot_state_publisher 时间源设置
