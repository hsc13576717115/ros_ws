# Nav2 参数配置（SLAM 实时建图 + 导航模式）
# 适用启动：ros2 launch nav2_config dog_slam_navigation.py
# 本文件由以下模块共同读取：
# - controller_server（局部控制）
# - planner_server（全局规划）
# - behavior_server（恢复行为）
# - smoother_server（路径平滑）
# - bt_navigator（行为树导航）
# - local_costmap / global_costmap（代价地图）

controller_server:
  ros__parameters:
    use_sim_time: false                    # 是否使用仿真时间；真机保持 false
    controller_frequency: 20.0             # 控制器循环频率(Hz) - 降低以适应 Orange Pi 性能
    min_x_velocity_threshold: 0.001        # 线速度死区阈值（x）
    min_y_velocity_threshold: 0.001        # 线速度死区阈值（y）
    min_theta_velocity_threshold: 0.001    # 角速度死区阈值
    failure_tolerance: 0.3                 # 允许短时控制失败的容忍时间(s)
    progress_checker_plugin: "progress_checker"  # 进度检查器插件名
    goal_checker_plugins: ["goal_checker"]       # 到点检查器插件名列表（Humble 参数写法）
    controller_plugins: ["FollowPath"]           # 启用的局部控制插件列表

    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"  # 外层旋转shim：到目标区后锁定原地旋转，不退回路径跟踪
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"  # 主路径跟踪器
      angular_dist_threshold: 0.52         # 更早先转向再走，减少四足边走边拧导致的切角
      angular_disengage_threshold: 0.12    # 退出shim时仍保留一定对齐余量，减少反复切换
      rotate_to_heading_angular_vel: 0.24  # 原地对齐角速度(rad/s)，与桥接层限幅保持一致
      max_angular_accel: 0.35              # 角加速度(rad/s^2)，降低原地修朝向时的过冲
      forward_sampling_distance: 0.30      # 缩短前向采样距离，低速小空间中更稳
      simulate_ahead_time: 0.6             # 缩短旋转碰撞前瞻时间，避免过度保守
      rotate_to_goal_heading: true         # 进目标区后只做原地朝向对齐（最短角路径）
      closed_loop: true                    # 用里程计角速度闭环约束旋转过程

      desired_linear_vel: 0.14             # 室内平地低速巡航，优先跟踪精度
      lookahead_dist: 0.45                 # 减小前瞻，提升小空间路径贴合度
      min_lookahead_dist: 0.22             # 最小前瞻距离(m)
      max_lookahead_dist: 0.60             # 最大前瞻距离(m)
      lookahead_angle: 0.3                 # 前瞻角限制(rad)
      use_velocity_scaled_lookahead_dist: false   # 低速精确导航下使用固定前瞻更稳定
      use_approach_vel_scaling: true       # 接近目标时自动降速
      approach_velocity_scaling_dist: 0.8  # 提前降速，给终点对齐留出缓冲
      min_approach_linear_velocity: 0.03   # 避免接近目标时速度过小落入步态死区
      max_allowed_linear_accel: 0.35       # 最大线加速度，减少起停前冲
      regulated_linear_scaling_min_radius: 0.90
      regulated_linear_scaling_min_speed: 0.05
      use_cost_regulated_linear_velocity_scaling: true  # 障碍附近自动降速
      cost_scaling_dist: 0.50              # 更早在贴边场景下减速
      cost_scaling_gain: 0.60              # 提高贴障减速强度，改善停车精度
      inflation_cost_scaling_factor: 2.5   # 与膨胀层匹配的代价缩放系数 - 降低梯度陡度
      use_rotate_to_heading: false         # 关闭RPP内置转向，避免与RotationShim重复导致频繁停转
      rotate_to_heading_min_angle: 0.35    # 兼容保留（RPP关闭转向时该项基本不生效）
      allow_reversing: false               # 四足保持不倒车

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"  # 进度检查器实现
      required_movement_radius: 0.15        # 低速模式下降低进度阈值，避免误判卡住
      movement_time_allowance: 20.0         # 给四足低速精确调整更多时间

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"  # 到点检查器实现
      xy_goal_tolerance: 0.30               # 位置进入该范围后，不再回退到位置检查
      yaw_goal_tolerance: 0.30              # 朝向容差，先保证稳定收敛，后续再按实机收紧
      stateful: true                        # 一旦进入xy容忍就不再回退xy检查，只做朝向修正

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0        # 期望全局规划频率(Hz)
    use_sim_time: false                     # 是否使用仿真时间
    planner_plugins: ["GridBased"]          # 全局规划插件列表
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"  # Smac Hybrid A* 规划器
      tolerance: 0.10                       # 将近目标容差收紧，避免规划在目标附近找“替代终点”
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true                   # 是否允许穿过未知区域
      max_iterations: 1000000
      max_on_approach_iterations: 300
      max_planning_time: 2.0
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 72
      minimum_turning_radius: 0.25
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.20
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 1.2
      smooth_path: true

smoother_server:
  ros__parameters:
    use_sim_time: false                     # 是否使用仿真时间
    smoother_plugins: ["simple_smoother"]   # 路径平滑插件列表
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"  # 简单平滑器
      tolerance: 1.0e-10                    # 迭代收敛阈值
      max_its: 1000                         # 最大迭代次数
      do_refinement: true                   # 是否启用二次细化

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.14, 0.0, 0.24]
    min_velocity: [-0.14, 0.0, -0.24]
    max_accel: [0.35, 0.0, 0.35]
    max_decel: [-0.45, 0.0, -0.35]
    odom_topic: "/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.35

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw         # 行为模块订阅的局部代价地图
    footprint_topic: local_costmap/published_footprint  # 机器人足迹话题
    cycle_frequency: 10.0                             # 恢复行为循环频率(Hz)
    behavior_plugins: ["spin", "backup", "wait"]      # 启用的恢复行为
    global_frame: odom                                # 恢复行为参考坐标系
    robot_base_frame: base_link                       # 机器人基座坐标系
    use_sim_time: false                               # 是否使用仿真时间

    spin:
      plugin: "nav2_behaviors/Spin"                   # 原地旋转行为
    backup:
      plugin: "nav2_behaviors/BackUp"                 # 后退脱困行为
    wait:
      plugin: "nav2_behaviors/Wait"                   # 等待行为

bt_navigator:
  ros__parameters:
    use_sim_time: false                               # 是否使用仿真时间
    global_frame: "map"                               # 全局导航参考坐标系
    robot_base_frame: "base_link"                     # 机器人基座坐标系
    odom_topic: "/odom"                               # 里程计话题
    bt_loop_duration: 20                              # 行为树循环周期(ms)；低速真机保持足够响应，同时减少调度开销
    default_server_timeout: 20                        # 行为树节点默认超时(s)
    enable_groot_monitoring: false                    # 关闭 Groot 监控，减少额外发布与序列化开销
    # 行为树可用插件库（动作/条件节点）
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_controller_selector_bt_node
    - nav2_path_longer_on_approach_bt_node
    - nav2_wait_cancel_bt_node
    - nav2_spin_cancel_bt_node
    - nav2_back_up_cancel_bt_node
    - nav2_assisted_teleop_cancel_bt_node
    - nav2_drive_on_heading_bt_node
    - nav2_is_path_valid_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    default_nav_to_pose_bt_node_xml: "navigate_to_pose_w_path_invalid_replanning_and_recovery.xml" # 单目标导航默认行为树
    default_nav_through_poses_bt_node_xml: "navigate_to_pose_w_replanning_and_recovery.xml" # 多目标导航默认行为树

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: false                     # bt_navigator 的 rclcpp wrapper 参数

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0                 # 局部代价地图更新频率(Hz)，降低算力占用
      publish_frequency: 5.0                 # 局部代价地图发布频率(Hz)，只影响显示链路，不影响内部控制更新
      global_frame: odom                    # 局部代价地图坐标系（通常 odom）
      robot_base_frame: base_link           # 机器人基座坐标系
      use_sim_time: false                   # 是否使用仿真时间
      rolling_window: true                  # 局部地图是否跟随机器人滚动
      width: 3                              # 局部地图宽度(m)
      height: 3                             # 局部地图高度(m)
      resolution: 0.05                      # 地图分辨率(m/格)
      footprint: "[[0.4, 0.225], [0.4, -0.225], [-0.4, -0.225], [-0.4, 0.225]]"  # 机器人足迹多边形（长0.8m，宽0.45m，中心对称）
      plugins: ["voxel_layer", "inflation_layer"]   # 局部地图启用插件

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"   # 障碍膨胀层
        cost_scaling_factor: 2.5                    # 膨胀代价衰减系数 - 降低梯度陡度
        inflation_radius: 0.3                      # 膨胀半径(m)，减小膨胀范围同时保持大于机体内切半径

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"       # 三维体素障碍层（用激光更新）
        enabled: true                               # 是否启用
        footprint_clearing_enabled: true            # 清除机器人足迹内障碍，避免把机体自身打成障碍
        publish_voxel_map: false                    # 关闭体素可视化发布，节省 CPU / 带宽
        origin_z: 0.0                               # 体素地图Z原点
        z_resolution: 0.05                          # Z方向分辨率
        z_voxels: 16                                # Z方向体素层数
        max_obstacle_height: 2.0                    # 最大障碍高度(m)
        mark_threshold: 0                           # 体素标记阈值
        observation_sources: scan                   # 观测源列表
        scan:
          topic: /scan                              # 激光话题
          max_obstacle_height: 2.0                  # 激光可标记的最大高度
          clearing: true                            # 是否清障
          marking: true                             # 是否标障
          data_type: "LaserScan"                    # 观测数据类型
          raytrace_max_range: 3.0                   # 清障射线最大距离(m)
          raytrace_min_range: 0.46                  # 清障射线最小距离(m) - 覆盖 footprint 外接半径，忽略机体轮廓内点云
          obstacle_max_range: 2.5                   # 标障最大距离(m)
          obstacle_min_range: 0.46                  # 标障最小距离(m) - 覆盖 footprint 外接半径，忽略机体轮廓内点云

      always_send_full_costmap: False               # 改为增量更新，降低 RViz 和 DDS 负载

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 3.0                         # 全局代价地图更新频率(Hz)，降低算力占用
      publish_frequency: 1.0                        # 全局代价地图发布频率(Hz)，显示足够且更省资源
      global_frame: map                             # 全局地图坐标系（map）
      robot_base_frame: base_link                   # 机器人基座坐标系
      use_sim_time: false                           # 是否使用仿真时间
      footprint: "[[0.4, 0.225], [0.4, -0.225], [-0.4, -0.225], [-0.4, 0.225]]"  # 机器人足迹多边形（长0.8m，宽0.45m，中心对称）
      resolution: 0.05                              # 地图分辨率(m/格)
      track_unknown_space: true                     # 是否保留未知区域
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]  # 全局地图插件

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"      # 静态地图层（从/map构建）
        map_subscribe_transient_local: True         # 订阅静态地图时使用 transient_local

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"    # 障碍物层
        enabled: true                               # 是否启用障碍层
        footprint_clearing_enabled: true            # 清除机器人足迹内障碍，避免把机体自身打成障碍
        observation_sources: scan                   # 观测源列表
        scan:
          topic: /scan                              # 激光话题
          max_obstacle_height: 2.0                  # 激光可标记的最大高度
          clearing: true                            # 是否清障
          marking: true                             # 是否标障
          data_type: "LaserScan"                    # 观测数据类型
          raytrace_max_range: 12.0                  # 清障射线最大距离(m)
          raytrace_min_range: 0.46                  # 清障射线最小距离(m) - 覆盖 footprint 外接半径，忽略机体轮廓内点云
          obstacle_max_range: 12.0                  # 标障最大距离(m)
          obstacle_min_range: 0.46                  # 标障最小距离(m) - 覆盖 footprint 外接半径，忽略机体轮廓内点云

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"   # 膨胀层
        cost_scaling_factor: 2.5                    # 膨胀代价衰减系数 - 降低梯度陡度
        inflation_radius: 0.3                      # 膨胀半径(m)，减小膨胀范围同时保持大于机体内切半径

      always_send_full_costmap: False               # 改为增量更新，降低 RViz 和 DDS 负载

map_server:
  ros__parameters:
    use_sim_time: false                             # 是否使用仿真时间（SLAM模式下map来自cartographer）

robot_state_publisher:
  ros__parameters:
    use_sim_time: false                             # robot_state_publisher 时间源设置
