# YOLOv11n RKNN Detection Parameters
#
# 配置文件说明:
#   所有路径都是相对于包安装目录的相对路径
#   安装后通常位于: install/yolov11n_rknn/share/yolov11n_rknn/
#
# 使用方法:
#   ros2 launch yolov11n_rknn yolo_detection.launch.py
#   ros2 launch yolov11n_rknn yolo_detection.launch.py --params-file config/detection_params.yaml

# =============================================================================
# 节点参数
# =============================================================================
yolo_detection_node:
  ros__parameters:

    # -----------------------------------------------------------------------
    # 模型配置
    # -----------------------------------------------------------------------
    # RKNN模型文件路径（相对于包共享目录）
    # 模型文件应放置在: models/ 目录下
    # 安装后路径: <install>/yolov11n_rknn/share/yolov11n_rknn/models/light-1.rknn
    model_path: "models/light.rknn"

    # 类别数量（根据你的模型修改）
    num_classes: 1

    # 类别名称列表（根据你的模型修改）
    # 示例: ["ball", "cup", "person", "car", ...]
    class_names: ["ball"]

    # -----------------------------------------------------------------------
    # 检测阈值
    # -----------------------------------------------------------------------
    # 置信度阈值 [0.0 - 1.0]
    #   - 较低的值会检测更多目标，但可能包含误检
    #   - 较高的值会更严格，但可能漏检
    conf_threshold: 0.5

    # NMS IoU阈值 [0.0 - 1.0]
    #   - 用于抑制重叠的检测框
    #   - 典型值: 0.4 - 0.6
    nms_threshold: 0.45

    # -----------------------------------------------------------------------
    # 可视化设置
    # -----------------------------------------------------------------------
    # 是否显示检测窗口
    show_detection: true

    # 是否发布带检测框的图像到 /yolo/detection_image
    #   - 注意: 启用会增加网络带宽和CPU使用
    publish_image: false

    # -----------------------------------------------------------------------
    # 摄像头设置
    # -----------------------------------------------------------------------
    # 摄像头设备ID
    #   - 0 通常对应 /dev/video0
    #   - 1 通常对应 /dev/video1
    #   - 使用 v4l2-ctl 查看可用设备: v4l2-ctl --list-devices
    camera_id: 0

    # 是否在节点启动后立即开始识别
    #   - 设为 false 时，可通过 /yolo/enable 话题在任务点按需开启识别
    start_enabled: true

    # 运行时启停识别控制话题
    enable_topic: "/yolo/enable"
    #
    # 摄像头采集配置（硬编码在源码中）:
    #   - 分辨率: 640x480 (摄像头原生分辨率)
    #   - 帧率: 120 fps (MJPG格式)
    #   - 格式: MJPG (Motion-JPEG)
    #   注: 模型输入仍为 640x640，会自动 resize

    # -----------------------------------------------------------------------
    # 输入分辨率 (固定为 640x640)
    # -----------------------------------------------------------------------
    # 输入图像分辨率，与模型训练时的分辨率一致
    # - 修改此项需要重新训练/转换模型
    input_width: 640
    input_height: 640

# =============================================================================
# 模型文件管理
# =============================================================================
#
# 模型文件应放置在以下位置:
#
# 源码目录结构:
#   yolov11n_rknn/
#   ├── models/
#   │   ├── light-1.rknn           # RKNN 模型文件
#   │   ├── light.onnx             # ONNX 模型（用于转换）
#   │   └── dataset.txt            # 量化校准数据集
#   ├── data/
#   │   └── test.jpg               # 测试图像
#   ├── src/
#   ├── include/
#   └── ...
#
# 安装后的目录结构:
#   install/yolov11n_rknn/
#   ├── lib/
#   │   └── yolo_detection_node
#   └── share/yolov11n_rknn/
#       ├── models/
#       │   └── light-1.rknn       # 安装的模型文件
#       ├── launch/
#       ├── config/
#       └── ...
#
# =============================================================================
