# 电机与板载 SocketCAN 接口/CAN ID 映射表。
# joint0 对应肩关节，joint1 对应肘关节。

joint0:
  # 历史字段名仍为 serial_port，但这里实际填写的是板载 SocketCAN 接口名。
  serial_port: can0

  # 兼容保留字段；当前现场使用 can0，CAN 总线速率为 1000000 bps。
  baud_rate: 1000000

  # 电机从机 CAN ID。
  can_id: 1

  # 电机主机/主控 ID。
  # 当前驱动初始化电机对象时会同时记录 slave/master 两个 ID。
  mst_id: 11

  # 电机型号。决定 MIT 限幅范围和解析方式。
  motor_type: DM4340

joint1:
  # 历史字段名仍为 serial_port，但这里实际填写的是板载 SocketCAN 接口名。
  serial_port: can0

  # 兼容保留字段；当前现场使用 can0，CAN 总线速率为 1000000 bps。
  baud_rate: 1000000

  # 电机从机 CAN ID。
  can_id: 2

  # 电机主机/主控 ID。
  mst_id: 12

  # 电机型号。决定 MIT 限幅范围和解析方式。
  motor_type: DM4340
